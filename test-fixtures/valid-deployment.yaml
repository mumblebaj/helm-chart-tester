---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valid-deployment
  labels:
    app: valid-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: valid-app
  template:
    metadata:
      labels:
        app: valid-app
    spec:
      serviceAccountName: default
      containers:
        - name: web
          image: nginx:1.23.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: valid-service
spec:
  selector:
    app: valid-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
