---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-ingress
spec:
  rules:
    - host: example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: test-service
                port:
                  number: 80
---
apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: deprecated-api
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: old-app
    spec:
      containers:
        - name: deprecated
          image: nginx:1.20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
